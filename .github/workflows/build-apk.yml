name: Build IOKing APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Décompresser IOKing
        run: |
          mkdir ioking
          unzip -o IOKING_ANDROID_READY.zip -d ioking

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Construire APK
        run: |
          cd ioking
          gradle assembleDebug

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: IOKing-V3-APK
          path: ioking/app/build/outputs/apk/debug/app-debug.apk
